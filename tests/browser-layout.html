<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Calendar layout regression fixture</title>
  <style>
    body { margin: 24px; font: 14px/1.4 system-ui, sans-serif; color: #222; }
    #results { padding: 12px; background: #f0f3f5; white-space: pre-wrap; }
    .fc { width: 1033px; max-width: 100%; }
    .fc-scroller-harness { position: relative; height: 570px; overflow: hidden; }
    .fc-scroller { position: absolute; inset: 0; overflow: hidden auto; }
    .fc-scrollgrid-sync-table { width: 100%; height: 570px; table-layout: fixed; border-collapse: collapse; }
    .fc-daygrid-day { border: 1px solid #ccc; padding: 0; vertical-align: top; }
    .fc-daygrid-day-frame { position: relative; min-height: 100%; }
    .fc-daygrid-day-top { display: flex; flex-direction: row-reverse; height: 24px; }
    .fc-daygrid-day-number { padding: 2px 4px; }
    /* The balanced-grid constraint observed on the actual calendar. */
    .fc-daygrid-body-balanced .fc-daygrid-day-events { position: absolute; left: 0; right: 0; }
    .fc-daygrid-event-harness { position: relative; }
    .fc-daygrid-event-harness-abs { position: absolute; }
    .calendar-game { display: flex; align-items: center; margin: 1px 2px; padding: 2px; background: #e7edf7; color: #123; text-decoration: none; }
    .fc-event-title { overflow: hidden; white-space: nowrap; text-overflow: ellipsis; }
    .fc-daygrid-more-link { display: block; cursor: pointer; margin: 2px; }
    button { cursor: pointer; }
  </style>
  <link rel="stylesheet" href="/extension/content.css">
  <script src="/extension/staffing.js" defer></script>
  <script src="/extension/overflow.js" defer></script>
  <script src="/tests/browser-layout.js" defer></script>
</head>
<body>
  <h1>Calendar layout regression fixture</h1>
  <p>Synthetic games only. Expand either busy day in the second week, or run the checks.</p>
  <button id="run-tests" type="button">Run layout checks</button>
  <pre id="results">Ready</pre>
  <main data-controller="calendar-main"><div class="fc" data-calendar-main-target="calendar">
    <div class="fc-scroller-harness"><div class="fc-scroller"><div class="fc-daygrid-body fc-daygrid-body-balanced" style="width:1033px">
      <table class="fc-scrollgrid-sync-table" style="width:1033px;height:570px"><tbody id="weeks"></tbody></table>
    </div></div></div>
  </div></main>
</body>
</html>
