<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Day and List badge fixture</title>
  <style>
    body { margin: 24px; font: 14px/1.4 system-ui, sans-serif; color: #222; }
    #results { padding: 12px; background: #f0f3f5; white-space: pre-wrap; }
    .fc { width: 900px; max-width: 100%; }
    .fc-header-toolbar { margin-bottom: 12px; }
    .fc-timeline-event-harness { margin: 12px 0; }
    a.calendar-game { display: flex; width: 230px; background: #3788d8; color: white; padding: 2px; text-decoration: none; }
    .fc-event-main { flex-grow: 1; }
    .fc-list-table { border-collapse: collapse; width: 100%; }
    .fc-list-table td { padding: 8px 14px; border-bottom: 1px solid #ddd; }
    .fc .fc-list-event:hover td { background-color: #f5f5f5; }
    .fc-list-event-title a { color: inherit; text-decoration: none; }
    .fc-list-event-time { white-space: nowrap; }
    .fc-list-day { background: #f0f0f0; text-align: left; }
    .cancelled-game { background: #f5d4d4; }
    button { cursor: pointer; }
  </style>
  <link rel="stylesheet" href="/extension/content.css">
  <script src="/extension/staffing.js" defer></script>
  <script src="/extension/overflow.js" defer></script>
  <script src="/tests/browser-views.js" defer></script>
  <script src="/extension/content.js" defer></script>
</head>
<body>
  <h1>Day and List badge fixture</h1>
  <p>Synthetic data only. The real content scripts run against mocked game-list responses.</p>
  <button id="day" type="button">Day</button>
  <button id="list" type="button">List</button>
  <button id="run-tests" type="button">Run view checks</button>
  <pre id="results">Ready</pre>
  <div id="fixture"></div>
</body>
</html>
